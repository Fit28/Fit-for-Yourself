function isoToday(){let d=new Date();return d.toLocaleDateString('sv-SE')}function fmtDate(s){return new Date(s+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DBNAME,DBVER);r.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('days'))d.createObjectStore('days',{keyPath:'date'});if(!d.objectStoreNames.contains('activities')){let s=d.createObjectStore('activities',{keyPath:'id'});s.createIndex('date','date')}if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'});if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function store(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}function get(name,key){return new Promise((res,rej)=>{let r=store(name).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(name,obj){return new Promise((res,rej)=>{let r=store(name,'readwrite').put(obj);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}function del(name,key){return new Promise((res,rej)=>{let r=store(name,'readwrite').delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}function all(name){return new Promise((res,rej)=>{let r=store(name).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function day(date){return await get('days',date)||{date,weight:'',waist:'',calories:'',protein:'',water:'',steps:'',meals:'',training:'',note:'',checks:{nutrition:false,training:false,water:false,sleep:false}}}
async function saveDay(){let d=await day(selectedDate);['weight','waist','calories','protein','water','steps','meals','training','note'].forEach(k=>d[k]=document.querySelector('#d_'+k)?.value||'');d.checks={nutrition:$('#c_nut').checked,training:$('#c_train').checked,water:$('#c_water').checked,sleep:$('#c_sleep').checked};await put('days',d);toast('Tag gespeichert ✓');renderHome();renderCalendar()}

async function openActivity(aid){let a=await get('activities',aid);if(!a)return;let t=types[a.type]||['•',a.type],photos=[];for(let pid of a.photoIds||[]){let p=await get('photos',pid);if(p)photos.push({id:pid,url:URL.createObjectURL(p.blob)})}openSheet(`<div class='row'><div><div class='small'>${fmtDate(a.date)}</div><h2>${t[0]} ${t[1]}</h2></div><button class='ghost' onclick='closeSheet()'>✕</button></div><div class='grid3'><div class='stat'><b>${a.distance||0}</b><span class='small'>km</span></div><div class='stat'><b>${a.duration||0}</b><span class='small'>Min.</span></div><div class='stat'><b>${a.elevation||0}</b><span class='small'>hm</span></div></div>${a.route?.length>1?`<div class='routebox' style='margin-top:10px' id='savedRoute'></div>`:''}<div class='small' style='margin-top:9px'>Schritte: <b>${a.steps||0}</b>${a.incline?` · Steigung: <b>${a.incline}%</b>`:''}</div>${a.note?`<div class='card'><b>Notiz</b><div>${a.note}</div></div>`:''}${photos.length?`<h3>📷 Erinnerungen</h3><div class='thumbs'>${photos.map(p=>`<img src='${p.url}'>`).join('')}</div>`:''}<button class='ghost' style='width:100%;margin-top:12px' onclick="editActivity('${a.id}')">Eintrag bearbeiten</button><button class='dangerBtn' style='width:100%;margin-top:8px' onclick="deleteActivity('${a.id}')">Aktivität löschen</button>`);setTimeout(()=>drawRoute('savedRoute',a.route),0)}
async function editActivity(aid){let a=await get('activities',aid);closeSheet();showPage('activityPage');gpsType=a.type;renderActivity();$$('.typebtn').forEach(x=>x.classList.toggle('on',x.dataset.type===a.type));updateActivityFields();$('#a_date').value=a.date;$('#a_start').value=a.start||'';$('#a_duration').value=a.duration||'';$('#a_distance').value=a.distance||'';if($('#a_elevation'))$('#a_elevation').value=a.elevation||'';if($('#a_steps'))$('#a_steps').value=a.steps||'';if($('#a_incline'))$('#a_incline').value=a.incline||'';$('#a_note').value=a.note||'';await del('activities',aid);toast('Eintrag geladen – nach Änderung neu speichern')}
async function deleteActivity(aid){if(!confirm('Aktivität wirklich löschen?'))return;let a=await get('activities',aid);for(let p of a.photoIds||[])await del('photos',p);await del('activities',aid);closeSheet();renderHome();renderCalendar();renderStats();toast('Gelöscht')}
function newActivity(date){closeSheet();showPage('activityPage');renderActivity();$('#a_date').value=date}
async function renderStats(){let acts=await all('activities'),days=await all('days'),sum=t=>acts.filter(a=>a.type===t).reduce((s,a)=>s+(a.distance||0),0),hm=acts.reduce((s,a)=>s+(a.elevation||0),0),steps=days.reduce((s,d)=>s+(+d.steps||0),0)+acts.reduce((s,a)=>s+(+a.steps||0),0);$('#statsPage').innerHTML=`<h1>Statistik</h1><div class='grid2'><div class='stat'><b>${sum('bike').toFixed(1)} km</b><span class='small'>🚴 Fahrrad</span></div><div class='stat'><b>${sum('walk').toFixed(1)} km</b><span class='small'>🚶 Spazieren</span></div><div class='stat'><b>${sum('hike').toFixed(1)} km</b><span class='small'>🥾 Wandern</span></div><div class='stat'><b>${sum('run').toFixed(1)} km</b><span class='small'>🏃 Laufen</span></div><div class='stat'><b>${sum('treadmill').toFixed(1)} km</b><span class='small'>🏃‍♂️ Laufband</span></div><div class='stat'><b>${Math.round(hm)} hm</b><span class='small'>⛰️ Höhenmeter</span></div></div><div class='card'><h2>Gesamt</h2><div class='grid3'><div class='metric'><span class='small'>Aktivitäten</span><b>${acts.length}</b></div><div class='metric'><span class='small'>Outdoor-km</span><b>${acts.filter(a=>['bike','walk','hike','run'].includes(a.type)).reduce((s,a)=>s+(a.distance||0),0).toFixed(1)}</b></div><div class='metric'><span class='small'>Schritte*</span><b>${steps.toLocaleString('de-DE')}</b></div></div><div class='small' style='margin-top:8px'>*Manuell eingetragene oder aus GPS-Distanz geschätzte Schritte.</div></div><div class='card'><h2>Letzte Aktivitäten</h2>${acts.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15).map(activityRow).join('')||'<div class="small">Noch keine Daten.</div>'}</div>`}
async function renderSettings(){let stride=await getSetting('stride',75),p=await getProfile();$('#settingsPage').innerHTML=`<h1>Mehr</h1><div class='card'><h2>👤 Profil</h2><div class='row'><div><b>${p.name?esc(p.name):'Profil noch nicht eingerichtet'}</b><div class='small'>Name, Profilbild, Alter, Größe, Gewicht, BMI und Wunschziel</div></div><button class='ghost' onclick='openProfile()'>Bearbeiten</button></div></div><div class='card'><h2>👟 Schrittlänge</h2><div class='small'>Für die Schätzung beim Spazieren, Wandern und Laufen.</div><label>Schrittlänge in cm</label><input id='stride' type='number' value='${stride}'><button class='primary' style='margin-top:9px' onclick='saveStride()'>Speichern</button></div><div class='card'><h2>💾 Backup</h2><p class='small'>Sichert Kalender, Tagesdaten, Aktivitäten, Routen und Fotos. Sinnvoll vor Handywechsel oder Browser-Datenlöschung.</p><div class='wraprow'><button class='primary' onclick='exportBackup()'>Backup herunterladen</button><label class='ghost' style='display:inline-block'>Backup einlesen<input id='importFile' type='file' accept='.json,application/json' style='display:none' onchange='importBackup(this.files[0])'></label></div></div><div class='card'><h2>ℹ️ GPS & Schritte</h2><div class='small'>GPS-Routen funktionieren über die Standortfreigabe der Web-App. Höhenwerte hängen vom GPS-Signal des Handys ab. Einen echten Samsung-Schrittzähler kann eine normale PWA nicht direkt aus Health Connect/Samsung Health auslesen; deshalb nutzt diese Version manuelle Schritte oder eine transparente Distanz-Schätzung.</div></div><div class='card'><h2>App</h2><div><b>Fit for Yourself</b></div><div class='small'>Eigenständige App – getrennt von FIT28 · Datenbank: ${DBNAME}</div></div>`}
async function saveStride(){await put('settings',{key:'stride',value:+$('#stride').value||75});toast('Gespeichert')}
async function exportBackup(){let payload={version:1,exported:new Date().toISOString(),days:await all('days'),activities:await all('activities'),settings:await all('settings'),photos:[]};for(let p of await all('photos')){let b64=await blobToDataURL(p.blob);payload.photos.push({id:p.id,activityId:p.activityId,data:b64})}let blob=new Blob([JSON.stringify(payload)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fit-for-yourself-backup-'+isoToday()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function blobToDataURL(b){return new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}async function dataURLBlob(u){let r=await fetch(u);return await r.blob()}async function importBackup(file){if(!file)return;if(!confirm('Backup einlesen? Vorhandene Einträge mit gleicher ID werden ersetzt.'))return;let x=JSON.parse(await file.text());for(let d of x.days||[])await put('days',d);for(let a of x.activities||[])await put('activities',a);for(let s of x.settings||[])await put('settings',s);for(let p of x.photos||[])await put('photos',{id:p.id,activityId:p.activityId,blob:await dataURLBlob(p.data)});toast('Backup wiederhergestellt ✓');renderAll()}
function showPage(id){$$('main section').forEach(s=>s.classList.add('hidden'));$('#'+id).classList.remove('hidden');$$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.page===id));if(id==='calendarPage')renderCalendar();if(id==='activityPage')renderActivity();if(id==='statsPage')renderStats();if(id==='settingsPage')renderSettings()}$$('.tabs button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));$('#modal').onclick=e=>{if(e.target.id==='modal')closeSheet()};
async function renderAll(){await renderHome();await renderCalendar();renderActivity();await renderStats();await renderSettings()}openDB().then(renderAll);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));

document.addEventListener('click',function(e){
  const img=e.target.closest && e.target.closest('img.zoomableExercise');
  if(!img) return;
  e.preventDefault();
  const ov=document.createElement('div');
  ov.className='ffyZoomOverlay';
  const big=document.createElement('img');
  big.src=img.src; big.alt=img.alt||'Übung';
  const close=document.createElement('button');
  close.className='ffyZoomClose'; close.type='button'; close.textContent='×';
  const hint=document.createElement('div');
  hint.className='ffyZoomText'; hint.textContent='Zum Schließen auf × oder neben das Bild tippen';
  function done(){ov.remove();document.body.style.overflow=''}
  close.addEventListener('click',done);
  ov.addEventListener('click',function(ev){if(ev.target===ov)done()});
  ov.append(big,close,hint);
  document.body.appendChild(ov);
  document.body.style.overflow='hidden';
});
